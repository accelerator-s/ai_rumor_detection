seed: 42

paths:
  train_csv: data/train.csv
  val_csv: data/val.csv
  cleaned_train_csv: outputs/cleaned/train.cleaned.csv
  cleaned_val_csv: outputs/cleaned/val.cleaned.csv
  cleaning_report_json: outputs/cleaned/cleaning_report.json
  pretrained_model: models/pretrained
  checkpoint_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions

data_cleaning:
  enabled: true
  emoji_normalization: true
  deduplicate: true
  conflict_policy: report
  overlap_check: true

model:
  name: vinai/bertweet-base
  num_labels: 2
  max_length: 128

training:
  epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  early_stopping_patience: 2
  mixed_precision: true

retrieval:
  top_k: 3

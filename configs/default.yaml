seed: 42

paths:
  train_csv: data/train.csv
  val_csv: data/val.csv
  pretrained_model: models/pretrained_roberta
  model_dir: models/outputs

data_cleaning:
  enabled: true
  emoji_normalization: true
  deduplicate: true
  conflict_policy: report
  overlap_check: true

model:
  name: cardiffnlp/twitter-roberta-base
  num_labels: 2
  max_length: 128

training:
  epochs: 8
  batch_size: 8
  validation_ratio: 0.1
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  head_learning_rate: 5.0e-5
  layerwise_lr_decay: 0.9
  weight_decay: 0.01
  warmup_ratio: 0.06
  early_stopping_patience: 4
  mixed_precision: true
  class_weighting: balanced
  label_smoothing: 0.05
  max_grad_norm: 1.0
  hidden_dropout_prob: 0.2
  attention_dropout_prob: 0.2
  threshold_min: 0.2
  threshold_max: 0.8
  threshold_step: 0.01
  selection_metric: accuracy
  threshold_tune_source: val
  tfidf_word_ngram_range: [1, 3]
  tfidf_word_min_df: 2
  tfidf_word_max_df: 0.95
  tfidf_char_ngram_range: [3, 5]
  tfidf_char_min_df: 2
  tfidf_char_max_df: 1.0
  tfidf_logreg_c: 1.0
  tfidf_class_weight: balanced
  tfidf_max_iter: 3000
  event_loss_weight: 0.15
  ensemble_bert_weight_min: 0.0
  ensemble_bert_weight_max: 1.0
  ensemble_bert_weight_step: 0.1

evaluation:
  threshold_search: true
  ensemble: true

logging:
  log_interval: 10
  report_interval: 1
  save_best: true
